name: CI

# Docs-only pushes/PRs are skipped. workflow_dispatch ignores path filters, so the
# release workflow's `gh workflow run ci.yml --ref sampo/release` always runs.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore ttsc plugin cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'lint.config.ts') }}
          restore-keys: |
            ttsc-${{ runner.os }}-${{ runner.arch }}-

      - name: Warn if changeset missing
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if echo "$CHANGED" | grep -Eq '^(src/|package\.json)'; then
            if ! echo "$CHANGED" | grep -q '^\.sampo/changesets/.*\.md$'; then
              echo "::warning::Releasable package changes without a Sampo changeset. Run 'sampo add' and commit the file under .sampo/changesets/."
            fi
          fi

      - name: Typecheck (ttsc)
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint --diagnostic-level=error

      - name: Unit tests
        run: bun run test
