name: Release

# On every push to main:
# 1. If the package version is not on npm yet AND the NPM_TOKEN repository
#    secret is set, publish it with npm provenance.
# 2. Otherwise, while changesets are pending, keep the `sampo/release` PR
#    (version bump + changelog) up to date.
#
# Until the owner adds NPM_TOKEN (docs/releasing.md) this workflow only
# maintains the release PR and never publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node (npm provenance)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Publish check
        id: publish_check
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [[ "$version" == "0.0.0" ]]; then
            echo "should_publish=false" >>"$GITHUB_OUTPUT"
            echo "0.0.0 is the never-released placeholder."
            exit 0
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "should_publish=false" >>"$GITHUB_OUTPUT"
            echo "${name}@${version} is already on npm."
          else
            echo "should_publish=true" >>"$GITHUB_OUTPUT"
            echo "${name}@${version} is not on npm."
          fi

      - name: Token gate
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            if [[ "${{ steps.publish_check.outputs.should_publish }}" == "true" ]]; then
              echo "::warning::${{ github.repository }} has an unpublished version, but the NPM_TOKEN repository secret is not set. Skipping publish. See docs/releasing.md."
            fi
          fi

      - name: Detect pending changesets
        id: changesets
        run: |
          set -euo pipefail
          shopt -s nullglob
          has_changesets=false
          for f in .sampo/changesets/*.md; do
            has_changesets=true
            break
          done
          echo "has_changesets=${has_changesets}" >>"$GITHUB_OUTPUT"

      - name: Run Sampo (release PR)
        if: ${{ steps.changesets.outputs.has_changesets == 'true' && steps.publish_check.outputs.should_publish != 'true' }}
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@d3f4020892ba2a8fd56298e417053bb86736fa88 # cargo-sampo-github-action-v0.19.0
        with:
          command: auto
          create-github-release: false
          base-branch: main
          pr-branch: sampo/release
          pr-title: "chore(release): publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger CI for release PR branch
        if: ${{ steps.sampo.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin sampo/release >/dev/null 2>&1; then
            gh workflow run ci.yml --ref sampo/release
          else
            echo "sampo/release branch not found; skipping CI dispatch."
          fi

      - name: Install dependencies
        if: ${{ steps.publish_check.outputs.should_publish == 'true' && steps.gate.outputs.enabled == 'true' }}
        run: bun install --frozen-lockfile

      - name: Pre-publish verification
        if: ${{ steps.publish_check.outputs.should_publish == 'true' && steps.gate.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run build

      - name: Publish package (npm provenance)
        if: ${{ steps.publish_check.outputs.should_publish == 'true' && steps.gate.outputs.enabled == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tarball="$(bun pm pack)"
          npm publish "$tarball" --access public --provenance
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "v${version}" >/dev/null 2>&1; then
            git tag "v${version}"
            git push origin "v${version}"
          fi
          gh release view "v${version}" >/dev/null 2>&1 || gh release create "v${version}" --title "v${version}" --generate-notes

